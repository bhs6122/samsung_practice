<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2>세종시 야간 약국 정보</h2>
        <div id="content"></div>
    </div>
    <script>
        const url = 'https://ggoreb.pythonanywhere.com/night_pharmacy/data/?search=세종';

        fetch(url)
            .then(res => res.json())    // JSON.parse()
            .then(data => {
                const code = `<table class="table table-bordered table-striped">
                                <thead class="table-dark">
                                    <tr>
                                        <th>약국명</th>
                                        <th>전화번호</th>
                                        <th>주소</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                        ${data.data.map((v) => {
                                            return `
                                                <tr>
                                                    <td>${v.name}</td>
                                                    <td>${v.tel}</td>
                                                    <td>${v.road_address}</td>
                                                </tr>
                                            `
                                        })}
                                    <tr>
                                        <td>OO약국</td>
                                        <td>051-1234-5678</td>
                                        <td>부산광역시 해운대구 OOO</td>
                                    </tr>
                                    </tbody>
                                    </table>
                                    `
                document.querySelector('#content').innerHTML = code
            })
    </script>
</body>
