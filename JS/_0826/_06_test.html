<body>
    <script>
        async function run() {
            url = 'http://ggoreb.com/api/toc.jsp'
            const res = await fetch(url)        // await를 쓰려면 function앞에 async써야됨
            const data = await res.text()
            console.log(data);
            const obj = JSON.parse(data)    // 역직렬화가 되어서 문자에서 객체로 바뀌게 된다.
            console.log(obj);
        }
        run()
    </script>
</body>
