<!-- 
■연습문제(06-연습문제10.html)
●점수가50점이상인학생의이름을결과와같이문자열로출력하기
(filter / map / join) -->

<body>
    <script>
        class Student {
            constructor(name, age, enrolled, score) {
                this.name = name;
                this.age = age;
                this.enrolled = enrolled;
                this.score = score;
            }
        }
        const students = [
            new Student('A', 29, true, 45),
            new Student('B', 28, false, 80),
            new Student('C', 30, true, 90),
            new Student('D', 40, false, 66),
            new Student('E', 18, true, 90)
        ];

        const newList = students.filter((v) => {
            return v.score >= 50
        }).map((v) => {
            return v.name
        }).join(', ')   //chaining: 끝나지 않고 계속 이어가는것을 의미
        
        console.log(newList);
    </script>
</body>
