<style>
    .container {
        display: flex;
        height: 150px;
        border: 1px solid gray;
        align-items: end;
        justify-content: space-around;
        flex-direction: row-reverse;
    }

    .container > div {
        width: 100px;
        height: 50px;
        background-color: lightblue;
        text-align: center;
        line-height: 50px;
        border: 1px solid navy;
    }
</style>

<body>
    <div class="container">
        <div>A</div>
        <div>B</div>
        <div>C</div>
        </div>
</body>
