<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAG Q&A</title>
  <style>
    body { font-family: Arial, sans-serif; max-width:800px; margin:40px auto; padding:0 16px; }
    textarea { width:100%; height:100px; }
    #answer { white-space:pre-wrap; background:#f7f7f7; padding:12px; border-radius:6px; margin-top:12px;}
    button { padding:8px 14px; font-size:16px; }
  </style>
</head>
<body>
  <h1>RAG Q&A (OpenAI + ChromaDB)</h1>
  <p>질문을 입력하고 <strong>질문하기</strong> 버튼을 누르세요.</p>

  <textarea id="question" placeholder="질문을 입력하세요..."></textarea>
  <div style="margin-top:8px;">
    <button id="askBtn">질문하기</button>
  </div>

  <h3>답변</h3>
  <div id="answer">아직 질문이 없습니다.</div>

  <script>
    document.getElementById('askBtn').addEventListener('click', async () => {
      const q = document.getElementById('question').value.trim();
      if (!q) return alert('질문을 입력하세요.');
      document.getElementById('answer').textContent = '응답 대기 중...';
      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question: q})
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('answer').textContent = data.detail || JSON.stringify(data);
        } else {
          document.getElementById('answer').textContent = data.answer;
        }
      } catch (e) {
        document.getElementById('answer').textContent = '요청 중 오류: ' + e.toString();
      }
    });
  </script>
</body>
</html>
